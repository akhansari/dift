[package]
name = "dift"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Git diffs, live."
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/akhansari/dift"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["git", "diff", "tui"]
authors = ["Amin Khansari"]
exclude = ["/dist/**"]

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
base64 = "0.23.1"
thiserror = "2.0.20"
gix = { version = "0.87.1", default-features = false, features = [
    "status",
    "revision",
    "revparse-regex",
    "sha1",
    "sha256",
] }
ignore = "0.4.33"
kdl = "6.7.1"
ratatui = "0.30.2"
usage-rs = "6.6.1"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
unicode-width = "0.2.2"
similar = { version = "3.2.0", features = ["inline", "unicode"] }
syntect = { version = "5.3.0", default-features = false, features = [
    "default-themes",
    "regex-fancy",
] }
two-face = { version = "0.5.2", default-features = false, features = [
    "syntect-fancy",
] }

[[test]]
name = "smoke"
test = false
bench = false

[[test]]
name = "perf"
test = false
bench = false
harness = false

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "process", "termios"] }
rustix-openpty = "0.2"

[target.'cfg(unix)'.dev-dependencies]
memmap2 = "0.9"
serde_json = "1"
tempfile = "3.27"
